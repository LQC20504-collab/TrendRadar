name: AI Self Test

# 临时工作流：仅用于验证 AI 模型/Key/endpoint 组合是否可用（2026-10-28 一次性验证，用完即删）
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Sync deps
        run: uv sync --frozen --no-dev
      - name: Call model
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
        run: |
          uv run python - <<'PY'
          import os
          from trendradar.ai.client import AIClient

          base = os.environ.get("AI_API_BASE", "")
          key = os.environ.get("AI_API_KEY", "")
          print("BASE set =", bool(base), "| KEY =", "set" if key else "MISSING")

          cases = [
              ("openai/glm-4.7-flash", {}),
              ("openai/glm-4.5-flash", {}),
              ("openai/glm-4.5-flash", {"thinking": {"type": "disabled"}}),
              ("openai/glm-4-flash", {}),
          ]
          for model, extra in cases:
              cfg = {
                  "MODEL": model, "API_KEY": key, "API_BASE": base,
                  "TIMEOUT": 120, "TEMPERATURE": 0.7, "MAX_TOKENS": 800,
                  "NUM_RETRIES": 0, "FALLBACK_MODELS": [], "EXTRA_PARAMS": extra,
              }
              tag = model + (f" extra={extra}" if extra else "")
              try:
                  out = AIClient(cfg).chat([{"role": "user", "content": "用一句话说明地球观测的意义"}])
                  print(f"[OK]   {tag} | len={len(out)} | {out[:100]!r}")
              except Exception as e:
                  print(f"[FAIL] {tag} | {type(e).__name__}: {str(e)[:100]}")
          PY
