name: Prompt Check

# 临时工作流：用真实模型跑一遍新版分析提示词，验证输出是否说人话（用完即删）
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Sync deps
        run: uv sync --frozen --no-dev
      - name: Run analysis prompt
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
        run: |
          uv run python - <<'PY'
          import json, os
          from trendradar.ai.client import AIClient
          from trendradar.ai.prompt_loader import load_prompt_template

          sys_prompt, user_tpl = load_prompt_template("ai_analysis_prompt.txt")

          rss_block = """### [Remote Sensing Applications: Society & Environment]
          - 结合Sentinel-1/2协同与电荷平衡约束的随机森林模型检索土壤水溶性盐离子 | 时间:10-31 02:57"""

          user = (user_tpl
                  .replace("{report_mode}", "incremental")
                  .replace("{report_type}", "增量分析")
                  .replace("{current_time}", "2026-10-31 02:57:55")
                  .replace("{news_count}", "0")
                  .replace("{rss_count}", "1")
                  .replace("{platforms}", "Remote Sensing Applications")
                  .replace("{keywords}", "卫星数据源, 遥感技术")
                  .replace("{news_content}", "（本轮无热榜数据）")
                  .replace("{rss_content}", rss_block)
                  .replace("{standalone_content}", "（无）")
                  .replace("{language}", "中文"))

          cfg = {
              "MODEL": os.environ.get("AI_MODEL", ""),
              "API_KEY": os.environ.get("AI_API_KEY", ""),
              "API_BASE": os.environ.get("AI_API_BASE", ""),
              "TIMEOUT": 180, "TEMPERATURE": 0.7, "MAX_TOKENS": 3000,
              "NUM_RETRIES": 1, "FALLBACK_MODELS": ["openai/glm-4.5-flash", "openai/glm-4-flash"],
              "EXTRA_PARAMS": {},
          }
          client = AIClient(cfg)
          raw = client.chat([
              {"role": "system", "content": sys_prompt},
              {"role": "user", "content": user},
          ])
          print("=== RAW START ===")
          print(raw)
          print("=== RAW END ===")
          cleaned = raw.strip()
          if cleaned.startswith("```"):
              cleaned = "\n".join(l for l in cleaned.splitlines() if not l.strip().startswith("```")).strip()
          try:
              data = json.loads(cleaned)
              print("=== 解析成功，各板块字数 ===")
              for k, v in data.items():
                  if isinstance(v, str):
                      print(f"{k}: {len(v)} 字")
          except Exception as e:
              print("=== JSON 解析失败:", e)
          PY
